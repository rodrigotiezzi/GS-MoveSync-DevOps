<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar Semáforo' : 'Novo Semáforo')}"></head>
<body class="app">
<div th:replace="~{fragments/layout :: menu}"></div>

<main class="conteudo">

    <a class="link-voltar" th:href="@{/web/semaforo}">Voltar para semáforos</a>
    <header class="cabecalho">
        <h1 th:text="${modoEdicao} ? 'Editar semáforo' : 'Novo semáforo'">Semáforo</h1>
    </header>

    <div class="vazio-bloco" th:if="${cruzamentos.isEmpty()}">
        <p>Cadastre um cruzamento antes do semáforo.</p>
        <a class="btn btn-primario" th:href="@{/web/cruzamento/novo}">Cadastrar cruzamento</a>
    </div>

    <form class="form-card" th:if="${!cruzamentos.isEmpty()}"
          th:action="${modoEdicao} ? @{/web/semaforo/{id}(id=${id})} : @{/web/semaforo}"
          th:object="${semaforo}"
          method="post">

        <div class="form-grade">
            <div class="campo">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" th:field="*{codigo}" placeholder="SEM-001"
                       th:classappend="${#fields.hasErrors('codigo')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>
            </div>

            <div class="campo">
                <label for="idCruzamento">Cruzamento</label>
                <select id="idCruzamento" th:field="*{idCruzamento}"
                        th:classappend="${#fields.hasErrors('idCruzamento')} ? 'invalido'">
                    <option th:each="cz : ${cruzamentos}" th:value="${cz.id}" th:text="${cz.nome}"></option>
                </select>
                <span class="erro-campo" th:if="${#fields.hasErrors('idCruzamento')}" th:errors="*{idCruzamento}"></span>
            </div>

            <div class="campo">
                <label for="tipo">Tipo</label>
                <select id="tipo" th:field="*{tipo}">
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.name() == 'PEDESTRE' ? 'Pedestre' : 'Veicular'}"></option>
                </select>
            </div>

            <div class="campo">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option th:each="st : ${statusOpcoes}" th:value="${st}"
                            th:text="${st.name() == 'MANUTENCAO' ? 'Manutenção' : #strings.capitalize(#strings.toLowerCase(st.name()))}"></option>
                </select>
            </div>

            <div class="campo">
                <label for="tempoVerde">Tempo de verde (s)</label>
                <input type="number" id="tempoVerde" th:field="*{tempoVerde}"
                       th:classappend="${#fields.hasErrors('tempoVerde')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('tempoVerde')}" th:errors="*{tempoVerde}"></span>
            </div>

            <div class="campo">
                <label for="tempoAmarelo">Tempo de amarelo (s)</label>
                <input type="number" id="tempoAmarelo" th:field="*{tempoAmarelo}"
                       th:classappend="${#fields.hasErrors('tempoAmarelo')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('tempoAmarelo')}" th:errors="*{tempoAmarelo}"></span>
            </div>

            <div class="campo">
                <label for="tempoVermelho">Tempo de vermelho (s)</label>
                <input type="number" id="tempoVermelho" th:field="*{tempoVermelho}"
                       th:classappend="${#fields.hasErrors('tempoVermelho')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('tempoVermelho')}" th:errors="*{tempoVermelho}"></span>
            </div>
        </div>

        <div class="form-acoes">
            <button type="submit" class="btn btn-primario">Salvar semáforo</button>
            <a class="btn btn-secundario" th:href="@{/web/semaforo}">Cancelar</a>
        </div>
    </form>

    <!-- Sensores e câmeras do semáforo: só faz sentido depois que ele já existe -->
    <section class="bloco" th:if="${modoEdicao}">
        <h2>Sensores e câmeras deste semáforo</h2>

        <ul th:if="${!dispositivosVinculados.isEmpty()}">
            <li th:each="d : ${dispositivosVinculados}">
                <span th:text="${d.codigo}">CAM-001</span>
                <small th:text="${d.tipo} + (${d.online} ? ' · online' : ' · offline')">CAMERA · online</small>
                <form th:action="@{/web/semaforo/{idSem}/dispositivo/{idDisp}/remover(idSem=${id}, idDisp=${d.id})}"
                      method="post">
                    <button type="submit" class="btn btn-perigo btn-pequeno"
                            onclick="return confirm('Remover este dispositivo do semáforo?')">Remover</button>
                </form>
            </li>
        </ul>
        <p th:if="${dispositivosVinculados.isEmpty()}" class="vazio">Nenhum dispositivo vinculado.</p>

        <form class="form-vinculo" th:if="${podeVincular}"
              th:action="@{/web/semaforo/{idSem}/dispositivo(idSem=${id})}" method="post">
            <div class="campo">
                <label for="idDispositivo">Dispositivo</label>
                <select id="idDispositivo" name="idDispositivo" required>
                    <option th:each="d : ${dispositivosDisponiveis}" th:value="${d.id}"
                            th:text="${d.codigo} + ' (' + ${d.tipo} + ')'"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primario">Vincular dispositivo</button>
        </form>
        <p th:if="${dispositivosVinculados.size() >= limiteDispositivos}" class="vazio"
           th:text="'Limite de ' + ${limiteDispositivos} + ' dispositivos por semáforo atingido.'"></p>
        <p th:if="${dispositivosDisponiveis.isEmpty() and dispositivosVinculados.size() < limiteDispositivos}" class="vazio">
            Não há outros dispositivos cadastrados. <a th:href="@{/web/dispositivo/novo}">Cadastrar dispositivo</a>
        </p>
    </section>

</main>
</body>
</html>
