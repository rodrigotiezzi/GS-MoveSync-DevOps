<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${modoEdicao} ? 'Editar Dispositivo' : 'Novo Dispositivo')}"></head>
<body class="app">
<div th:replace="~{fragments/layout :: menu}"></div>

<main class="conteudo">

    <a class="link-voltar" th:href="@{/web/dispositivo}">Voltar para sensores e câmeras</a>
    <header class="cabecalho">
        <h1 th:text="${modoEdicao} ? 'Editar dispositivo' : 'Novo dispositivo'">Dispositivo</h1>
    </header>

    <form class="form-card"
          th:action="${modoEdicao} ? @{/web/dispositivo/{id}(id=${id})} : @{/web/dispositivo}"
          th:object="${dispositivo}"
          method="post">

        <div class="form-grade">
            <div class="campo">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" th:field="*{codigo}" placeholder="CAM-001"
                       th:classappend="${#fields.hasErrors('codigo')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></span>
            </div>

            <div class="campo">
                <label for="tipo">Tipo</label>
                <select id="tipo" th:field="*{tipo}">
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <div class="campo">
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" th:field="*{modelo}" placeholder="Câmera fictícia MS-CAM v1"
                       th:classappend="${#fields.hasErrors('modelo')} ? 'invalido'">
                <span class="erro-campo" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></span>
            </div>

            <div class="campo">
                <label for="online">Situação</label>
                <select id="online" th:field="*{online}">
                    <option th:value="true">Online</option>
                    <option th:value="false">Offline</option>
                </select>
            </div>
        </div>

        <div class="form-acoes">
            <button type="submit" class="btn btn-primario">Salvar dispositivo</button>
            <a class="btn btn-secundario" th:href="@{/web/dispositivo}">Cancelar</a>
        </div>
    </form>

</main>
</body>
</html>
