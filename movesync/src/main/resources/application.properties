spring.application.name=movesync

# Banco de dados (Azure SQL / SQL Server) - valores vem de variaveis de ambiente.
# No Azure Web App: Settings > Environment variables (App settings), criadas pelo script /scripts/infra-azure.sh
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Segredos SEM valor padrao: precisam vir das variaveis de ambiente (nunca ficam no codigo)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD}

app.security.operador.username=${OPERADOR_USERNAME:operador}
app.security.operador.password=${OPERADOR_PASSWORD}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true

server.port=${PORT:8080}
